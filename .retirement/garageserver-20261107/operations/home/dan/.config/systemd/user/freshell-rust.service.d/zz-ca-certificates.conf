[Service]
# Keep explicit CA paths for systemd and Snap clients; keys.env uses the same paths.
Environment=SSL_CERT_FILE=/etc/ssl/certs/onecli/combined-ca.pem
Environment=REQUESTS_CA_BUNDLE=/etc/ssl/certs/onecli/combined-ca.pem
Environment=CURL_CA_BUNDLE=/etc/ssl/certs/onecli/combined-ca.pem
Environment=NODE_EXTRA_CA_CERTS=/etc/ssl/certs/onecli/gateway-ca.pem
