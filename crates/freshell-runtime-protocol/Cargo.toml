[package]
name = "freshell-runtime-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
freshell-activity = { path = "../freshell-activity" }
freshell-platform = { path = "../freshell-platform" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
thiserror = "2"

[dev-dependencies]
# Dev-only: the drift guard test asserts that the recipes built by
# freshell-platform are the ones this crate's approved digest list accepts.
freshell-platform = { path = "../freshell-platform" }
