[package]
name = "freshell-supervisor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
runtime-test-faults = []
provider-qualification = ["freshell-agent-runtime/provider-qualification"]

[dependencies]
freshell-agent-runtime = { path = "../freshell-agent-runtime" }
freshell-runtime-protocol = { path = "../freshell-runtime-protocol" }
freshell-runtime-observability = { path = "../freshell-runtime-observability" }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { package = "rusqlite", version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
chrono = { workspace = true }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
