[package]
name = "freshell-supervisor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
runtime-test-faults = []
provider-qualification = ["freshell-agent-runtime/provider-qualification"]

[dependencies]
freshell-sessions = { path = "../freshell-sessions" }
freshell-codex = { path = "../freshell-codex", default-features = false }
freshell-agent-runtime = { path = "../freshell-agent-runtime" }
freshell-runtime-protocol = { path = "../freshell-runtime-protocol" }
freshell-platform = { path = "../freshell-platform" }
freshell-runtime-observability = { path = "../freshell-runtime-observability" }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { package = "rusqlite", version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
chrono = { workspace = true }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# `test-util` unlocks `#[tokio::test(start_paused = true)]`, so tests expire
# budgets by advancing a paused clock instead of racing the wall clock.
tokio = { version = "1", features = ["test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json"] }
