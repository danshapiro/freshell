[package]
name = "freshell-deploy"
version = "0.1.0"
description = "Immutable generation deployment controller for Freshell"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
