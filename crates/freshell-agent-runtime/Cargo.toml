[package]
name = "freshell-agent-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
provider-qualification = []

[dependencies]
freshell-runtime-protocol = { path = "../freshell-runtime-protocol" }
freshell-sessions = { path = "../freshell-sessions" }
serde = { workspace = true }
# Preserve the sidecar's exact JavaScript Number values for checkpoint digests.
serde_json = { workspace = true, features = ["float_roundtrip"] }
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "2"
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt", "sync"] }
ryu-js = "1.0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
sha1 = "0.10"
flate2 = "1"
