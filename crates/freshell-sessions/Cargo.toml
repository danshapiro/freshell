[package]
name = "freshell-sessions"
version = "0.1.0"
description = "Layer C of the freshell Rust port: read-only coding-CLI transcript index, parsers, and session watcher. Faithful ports of the claude .jsonl (parseSessionContent), codex rollout .jsonl (parseCodexSessionContent), and opencode SQLite listing parsers, plus the notify-based session watcher (inotify) with DEV-0002 late-root liveness handling. Read-only: never mutates provider data."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# JSON line parsing for the claude/codex JSONL transcripts (JSON.parse parity,
# skip-on-error corruption tolerance). preserve_order matches the TS object model.
serde_json = { workspace = true }
# `derive` for `IndexedSession`/`FileEntry` (the persistent parse-cache format,
# `directory_index.rs`'s `rust-session-cache.json`) -- the boot-time cold-scan
# fix (5min -> seconds on a real 8.7GB+2.2GB corpus).
serde = { workspace = true }
# Timestamp serialization for amplifier stub metadata (ISO-8601 RFC-3339).
chrono = { workspace = true }
# ITEM-1 bundle stamping (`bundle_config.rs`): read amplifier's settings.yaml
# `bundle.active` when pre-writing session stubs. saphyr is the maintained
# pure-Rust YAML 1.2 successor to the archived serde_yaml (release 2026-07;
# yaml-rust2's successor project). default-features off: we only need
# untyped `Yaml` access to one nested string key, no serde.
saphyr = { version = "0.0.11", default-features = false }
# notify: the session-directory file watcher (session_watcher.rs).
notify = "6"
# node:sqlite -> rusqlite: the opencode.db read-only listing parser. `bundled`
# compiles the SQLite amalgamation so the parser is not coupled to the host's
# libsqlite3 version (deterministic across dev/CI/Windows).
rusqlite = { version = "0.31", features = ["bundled"] }
# SYNC-06 resume-resolve parity: the `shared/resume-input-parser.ts` port's
# candidate-extraction regexes + hint tables (`resume_input.rs`). `(?-u:\b)`
# keeps JS's ASCII \b word-boundary semantics. Same major already a direct
# dep of freshell-server (logging.rs redaction scrub).
regex = "1"
# Batch B (`directory_index`): the refreshable session-directory cache. `sync`
# for the refresh-serializing async Mutex, `rt`/`rt-multi-thread` for
# `spawn_blocking` (the full-sweep scan runs off the async executor thread),
# `time` for the TTL-expiry test, `macros` for `#[tokio::test]`.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# The amplifier-locator's single warn on an ambiguous (never-guess) same-cwd
# correlation refusal (`amplifier-session-locator.ts:727-733`'s `log.warn`
# equivalent) -- same version already used by `freshell-ws`.
tracing = "0.1"
# Session-directory project grouping follows the shared git-root resolution
# used by terminal metadata, so linked worktree sessions group under their
# parent repository while preserving the checkout as `cwd`.
freshell-platform = { path = "../freshell-platform" }

[dev-dependencies]
# The opencode SQLite parity test builds fixture databases with a writable connection
# before the parser opens them read-only (same bundled engine, unified by cargo).
rusqlite = { version = "0.31", features = ["bundled"] }
# codex_locator's warn-once-per-window test installs a thread-local layer
# that counts the codex_fork_ambiguous WARN events.
tracing-subscriber = "0.3"
# SESSION-07: unique temp-file names for `search.rs`'s file-content search
# tests (same version/feature set as every other crate's `uuid` dependency).
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dev-dependencies]
# amplifier_stub's rollback-on-partial-write test needs a deterministic,
# thread-scoped (not process-global) permission-denied write failure:
# `unshare(CLONE_FS)` + `umask()`. Same version freshell-ws already pins
# directly for `pane_ledger`'s `flock(2)`.
libc = "0.2"
