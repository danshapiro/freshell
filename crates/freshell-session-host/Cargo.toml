[package]
name = "freshell-session-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
fresh-agent-fixtures = []
opencode-docker-contract-tests = []
managed-stop-contract-tests = []
provider-startup-contract-tests = []

[dependencies]
freshell-opencode = { path = "../freshell-opencode", features = ["real-transport"] }
freshell-activity = { path = "../freshell-activity" }
freshell-agent-runtime = { path = "../freshell-agent-runtime" }
freshell-freshagent = { path = "../freshell-freshagent" }
freshell-codex = { path = "../freshell-codex", features = ["real-transport"] }
freshell-runtime-protocol = { path = "../freshell-runtime-protocol" }
freshell-runtime-observability = { path = "../freshell-runtime-observability" }
freshell-terminal = { path = "../freshell-terminal" }
freshell-platform = { path = "../freshell-platform" }
freshell-protocol = { path = "../freshell-protocol" }
freshell-sessions = { path = "../freshell-sessions" }
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util"] }
libc = "0.2"
tracing = "0.1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
url = "2"
tempfile = "3"

[dev-dependencies]
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
# The claude tests run the real sidecar over the CLI simulator through the
# sidecar-environment seam (FreshClaudeState::with_sidecar_environment).
freshell-freshagent = { path = "../freshell-freshagent", features = ["test-support"] }
freshell-supervisor = { path = "../freshell-supervisor" }

[[test]]
name = "opencode_docker_contract"
path = "tests/opencode_docker_contract.rs"
required-features = ["opencode-docker-contract-tests"]

[[test]]
name = "provider_startup_retry"
path = "tests/provider_startup_retry.rs"
required-features = ["provider-startup-contract-tests"]
