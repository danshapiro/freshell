# Enable only with the matching freshell-supervisor.service and a server binary
# built with `freshell-server/managed-runtime-v1`.
[Unit]
Requires=freshell-supervisor.service
After=freshell-supervisor.service

[Service]
Environment=FRESHELL_MANAGED_RUNTIME_V1=1
Environment=FRESHELL_RUNTIME_CONTROL_SOCKET=%h/.freshell/managed-runtime/control/supervisor.sock
Environment=FRESHELL_RUNTIME_CONTROL_SECRET_FILE=%h/.freshell/managed-runtime/control/secret
