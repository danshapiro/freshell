name: Electron Build

on:
  workflow_dispatch:
    inputs:
      fixture_processes_only:
        description: Run only native fixture process ownership checks
        type: boolean
        required: false
        default: false
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/electron-build.yml'
      - '.github/workflows/electron-release.yml'
      - 'src/**'
      - 'shared/**'
      - 'electron/**'
      - 'tools/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'assets/electron/**'
      - 'config/electron-builder.yml'
      - 'config/vite/**'
      - 'config/vitest/vitest.electron-runtime.config.ts'
      - 'config/vitest/vitest.electron.config.ts'
      - 'config/vitest/vitest.fixture-processes-native.config.ts'
      - 'test/unit/electron/**'
      - 'test/integration/electron/**'
      - 'test/integration/tooling/claude-fixture-processes-native.test.ts'
      - 'test/integration/providers/claude-local-provider.mjs'
      - 'test/support/**'
      - 'scripts/electron-dev-prerequisites.ts'
      - 'scripts/prepare-electron-runtime.ts'
      - 'scripts/ensure-claude-sidecar.ts'
      - 'scripts/bundled-node-version.json'
      - 'scripts/verify-electron-artifact.ts'
      - 'scripts/assert-native-windows-build.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'packages/freshell-mcp-runtime/package.json'
      - 'crates/freshell-claude-sidecar/package.json'

permissions:
  contents: read

jobs:
  fixture-processes:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.fixture_processes_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows fixture Job Object host
        if: runner.os == 'Windows'
        run: cargo build -p freshell-platform --example fixture-job-host --locked

      - name: Test Windows fixture Job Object host
        if: runner.os == 'Windows'
        run: cargo test -p freshell-platform --example fixture-job-host --locked

      - name: Test native fixture process ownership
        run: pnpm run test:vitest run test/integration/tooling/claude-fixture-processes-native.test.ts --config config/vitest/vitest.fixture-processes-native.config.ts

  build:
    if: ${{ !inputs.fixture_processes_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            installer: release/*.dmg
            runtime: release/mac/Freshell.app/Contents/Resources
          - os: macos-latest
            installer: release/*.dmg
            runtime: release/mac-arm64/Freshell.app/Contents/Resources
          - os: ubuntu-latest
            installer: |-
              release/*.AppImage
              release/*.deb
            runtime: release/linux-unpacked/resources
          - os: windows-2022
            installer: release/*.exe
            runtime: release/win-unpacked/resources
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # pnpm must exist before setup-node resolves its pnpm cache. The action
      # reads the exact version from the root packageManager pin.
      # Pinned revision of the v4 major; reads the exact version from the root
      # packageManager pin (no floating duplicate).
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows fixture Job Object host
        if: matrix.os == 'windows-2022'
        run: cargo build -p freshell-platform --example fixture-job-host --locked

      - name: Test Windows fixture Job Object host
        if: matrix.os == 'windows-2022'
        run: cargo test -p freshell-platform --example fixture-job-host --locked

      - name: Test native fixture process ownership
        if: matrix.os == 'windows-2022' || startsWith(matrix.os, 'macos')
        run: pnpm run test:vitest run test/integration/tooling/claude-fixture-processes-native.test.ts --config config/vitest/vitest.fixture-processes-native.config.ts

      # Exercise the native Windows Claude profile lookup and the generated
      # terminal hook behavior. Keep this scoped to the two owning Rust crates.
      - name: Test Windows Claude profile lookup
        if: matrix.os == 'windows-2022'
        run: cargo test --locked -p freshell-ws --lib claude_truth::tests::windows_from_env_uses_userprofile_default_and_ignores_home

      - name: Test generated Windows Claude hooks
        if: matrix.os == 'windows-2022'
        run: cargo test --locked -p freshell-platform --lib cli_launch::cli_argv_goldens_file::native_windows_generated_claude_hooks_work_in_shells

      # Exercise the real Windows owner-SID and ProfileList APIs for SYSTEM's
      # profile. The Linux Rust/browser jobs cannot cover this Windows branch.
      - name: Test Windows SYSTEM checkpoint-home rejection
        if: matrix.os == 'windows-2022'
        run: cargo test --locked -p freshell-server --bin freshell-server checkpoints::tests::windows_system_profile_is_rejected_as_checkpoint_scope

      # Checkpoint Git children run inside freshell-platform's shared
      # kill-on-close Job Object; a timed-out capture must leave no descendant.
      # These process-ownership steps run even when an earlier one failed, so
      # each reports its own result.
      - name: Test Windows checkpoint Job Object settlement
        if: ${{ !cancelled() && matrix.os == 'windows-2022' }}
        run: cargo test --locked -p freshell-server --bin freshell-server checkpoints::tests::checkpoint_timeout_settles_windows_job_descendant_before_returning

      # The shared kill-on-close Job Object on its own: terminating it, and
      # closing its last handle, end every process in it.
      - name: Test Windows kill-on-close Job Object
        if: ${{ !cancelled() && matrix.os == 'windows-2022' }}
        run: cargo test --locked -p freshell-platform --lib process_job::tests

      # The Claude sidecar's process-tree guard (a Job Object on Windows, a
      # process group on macOS), the graceful sidecar stop, and a session
      # stop's "confirmed" answer (what lets a session handoff start a new
      # writer), against Node fake sidecars. The crate's unit tests do not
      # build on Windows, so this behavior lives in an integration target
      # that runs everywhere.
      - name: Test Claude sidecar tree guard (Windows)
        if: ${{ !cancelled() && matrix.os == 'windows-2022' }}
        run: cargo test --locked -p freshell-freshagent --test claude_sidecar_teardown

      - name: Test Claude sidecar tree guard (macOS)
        if: ${{ !cancelled() && startsWith(matrix.os, 'macos') }}
        run: cargo test --locked -p freshell-freshagent --test claude_sidecar_teardown

      - name: Run Electron unit tests
        run: pnpm run test:electron

      # Build the host-native server before staging. The Windows job is always
      # native Windows, so its executable has the correct PE format.
      - name: Build native Rust server
        run: cargo build --release -p freshell-server --locked

      - name: Build and verify Electron installer (Unix)
        if: matrix.os != 'windows-2022'
        run: pnpm run electron:build

      - name: Build and verify Electron installer (Windows)
        if: matrix.os == 'windows-2022'
        run: pnpm run electron:build:win

      # The package scripts verify as part of the build; repeat the explicit
      # verifier as the CI receipt immediately before checkout-free testing.
      - name: Verify unpacked native artifact
        run: pnpm run verify:electron-artifact

      - name: Checkout-free native runtime acceptance
        run: pnpm run test:electron:runtime
        env:
          FRESHELL_ELECTRON_RUNTIME_DIR: ${{ matrix.runtime }}

      - name: Upload verified installer (Unix)
        if: matrix.os != 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified installer (Windows)
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 14
