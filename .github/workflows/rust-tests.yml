name: FreshAgent refusal state consumer red proof
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  FRESHELL_PROOF_FEATURE_COMMIT: 3ab82d04a9e743d493dfc815d4203ba91d964e88
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '1'
  CARGO_TERM_COLOR: never
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify feature parent and proof-only workflow
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify blocked send behavior first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/refusal-consumers"
          cargo test --locked -p freshell-supervisor --lib blocked_send -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/refusal-consumers/blocked-send.log"
          grep -q '^running 3 tests$' "$RUNNER_TEMP/refusal-consumers/blocked-send.log"
      - name: Loss cleanup must preserve the refusal
        id: loss
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p freshell-supervisor --lib verified_loss_cleanup_preserves_an_unadmitted_send_refusal -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/refusal-consumers/loss.log"
      - name: Initial source checks must ignore the refusal
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p freshell-supervisor --lib input_reservation_refused_tests -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/refusal-consumers/source.log"
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refusal-consumers-red-proof
          path: ${{ runner.temp }}/refusal-consumers/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify both state consumers failed
        if: always()
        run: |
          test '${{ steps.loss.outcome }}' = failure
          test '${{ steps.source.outcome }}' = failure
