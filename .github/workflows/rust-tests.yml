name: Held child meter regression proof

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRESHELL_PROOF_FEATURE_COMMIT: 151b12b8e9f282331b339d3b66e5faf888ed0750

jobs:
  held-child-green:
    name: Held child meter regression
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify proof source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify held child test passes in disposable sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/held-child-green"
          scripts/sandbox-test.sh --runtime-suite 'set -euo pipefail; export CARGO_BUILD_JOBS=2; cargo test --locked -p freshell-sessions --lib opencode_transfer::workspace_metadata_test_hooks::owned_pipe_meter_waits_for_a_held_child_to_exec_before_sampling -- --exact --nocapture | tee /tmp/held-child-green.log; grep -q "^running 1 test$" /tmp/held-child-green.log' 2>&1 | tee "$RUNNER_TEMP/held-child-green/output.log"
      - name: Retain complete output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: held-child-meter-green
          path: ${{ runner.temp }}/held-child-green/
          if-no-files-found: warn
          retention-days: 7

  held-child-mutation:
    name: Held child meter mutation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify proof source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove only the exec readiness wait
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/freshell-sessions/src/opencode_transfer.rs')
          source = path.read_text()
          needle = (
              '            wait_for_child_exec(pid, Duration::from_secs(5))\n'
              '                .expect("the spawned workspace Git child must reach exec or exit");\n'
          )
          if source.count(needle) != 1:
              raise SystemExit('expected one exact exec readiness call')
          path.write_text(source.replace(needle, '', 1))
          PY
          git diff --check
          git diff -- crates/freshell-sessions/src/opencode_transfer.rs
      - name: Verify held child test fails for the intended reason
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/held-child-mutation"
          scripts/sandbox-test.sh --runtime-suite 'set -euo pipefail; export CARGO_BUILD_JOBS=2; cargo test --locked -p freshell-sessions --lib opencode_transfer::workspace_metadata_test_hooks::owned_pipe_meter_waits_for_a_held_child_to_exec_before_sampling -- --exact --nocapture' 2>&1 | tee "$RUNNER_TEMP/held-child-mutation/output.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo 'The readiness mutation unexpectedly passed.' >&2
            exit 1
          fi
          grep -q '^running 1 test$' "$RUNNER_TEMP/held-child-mutation/output.log" || exit 1
          grep -Fq 'the meter must not finish while the child is held before exec' "$RUNNER_TEMP/held-child-mutation/output.log" || exit 1
      - name: Retain complete output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: held-child-meter-mutation
          path: ${{ runner.temp }}/held-child-mutation/
          if-no-files-found: warn
          retention-days: 7
