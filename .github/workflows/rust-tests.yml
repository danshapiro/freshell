name: Owned drainer identity wait proof

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRESHELL_PROOF_FEATURE_COMMIT: bed8ed764b56e0c160f650042f42a4d9fe1cbb15

jobs:
  original-thread-green:
    name: Owned drainer identity and parallel sessions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify proof source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/workflows/rust-tests.yml crates/freshell-sessions/src/opencode_transfer.rs)"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run held thread and full sessions tests in the disposable sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/drainer-wait-green"
          scripts/sandbox-test.sh --runtime-suite 'set -euo pipefail; unset RUST_TEST_THREADS; export CARGO_BUILD_JOBS=2; cargo test --locked -p freshell-sessions --lib opencode_transfer::workspace_metadata_test_hooks::drainer_exit_wait_tracks_the_original_live_thread_identity -- --exact --nocapture | tee /tmp/drainer-wait-unit.log; grep -q "^running 1 test$" /tmp/drainer-wait-unit.log; cargo test --locked -p freshell-sessions --lib -- --nocapture' 2>&1 | tee "$RUNNER_TEMP/drainer-wait-green/output.log"
      - name: Retain complete output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drainer-wait-green
          path: ${{ runner.temp }}/drainer-wait-green/
          if-no-files-found: warn
          retention-days: 7

  original-thread-mutation:
    name: Live drainer identity mutation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify proof source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/workflows/rust-tests.yml crates/freshell-sessions/src/opencode_transfer.rs)"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mutate the wait to incorrectly accept a live drainer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/freshell-sessions/src/opencode_transfer.rs')
          source = path.read_text()
          needle = (
              '            if drainer_identity(identity.tid)? != Some(identity) {\n'
              '                return Ok(());\n'
              '            }\n'
          )
          if source.count(needle) != 1:
              raise SystemExit('expected one exact drainer identity wait')
          path.write_text(source.replace(needle, '            return Ok(());\n', 1))
          PY
          git diff --check
      - name: Verify the held thread test rejects the mutation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/drainer-wait-mutation"
          set +e
          scripts/sandbox-test.sh --runtime-suite 'set -euo pipefail; export CARGO_BUILD_JOBS=2; cargo test --locked -p freshell-sessions --lib opencode_transfer::workspace_metadata_test_hooks::drainer_exit_wait_tracks_the_original_live_thread_identity -- --exact --nocapture' 2>&1 | tee "$RUNNER_TEMP/drainer-wait-mutation/output.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'The live-thread mutation unexpectedly passed.' >&2
            exit 1
          fi
          grep -q '^running 1 test$' "$RUNNER_TEMP/drainer-wait-mutation/output.log"
          grep -Fq 'the original live thread must not be considered gone' "$RUNNER_TEMP/drainer-wait-mutation/output.log"
      - name: Retain complete output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drainer-wait-mutation
          path: ${{ runner.temp }}/drainer-wait-mutation/
          if-no-files-found: warn
          retention-days: 7
