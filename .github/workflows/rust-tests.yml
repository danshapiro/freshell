name: Verify materialized acceptance assertion fails before fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialization-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify original source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '963ad2f901a70e32dd007893c3d45f2299168c23'
          test "$(git diff --name-only HEAD^ HEAD)" = $'.github/workflows/rust-tests.yml\ntest/unit/client/components/fresh-agent/FreshAgentView.test.tsx'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run materialized acceptance regression
        run: >-
          pnpm run test:vitest run test/unit/client/components/fresh-agent/FreshAgentView.test.tsx
          --config config/vitest/vitest.config.ts
          -t 'accepts an uncertain send when its conversation materializes in the same batch'
