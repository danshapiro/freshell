name: FreshAgent concurrent notice regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '54ad0d40c72836e9083016590dc64a3e9310edba'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run concurrent-notice regressions
        run: >-
          pnpm run test:vitest run
          test/unit/client/components/fresh-agent/FreshAgentView.test.tsx
          --config config/vitest/vitest.config.ts --maxWorkers=1
          -t 'keeps a provider error (while an informational notice appears and expires|and uncertain delivery independently visible)'
