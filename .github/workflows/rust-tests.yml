name: FreshAgent managed Codex parity proof 8ab

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FEATURE_SHA: 8ab1022682d5943a3d07db8c65452dddddbf380b
  CARGO_BUILD_JOBS: '2'
  CI: 'true'
  NO_COLOR: '1'

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify proof workflow and select exact feature source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/freshagent-parity-proof"
          printf '%s\n' setup > "$RUNNER_TEMP/freshagent-parity-proof/phase"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FEATURE_SHA"
          test "$(git diff --name-only "$FEATURE_SHA" HEAD)" = '.github/workflows/rust-tests.yml'
          git checkout --detach "$FEATURE_SHA"
          test "$(git rev-parse HEAD)" = "$FEATURE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD | tee "$RUNNER_TEMP/freshagent-parity-proof/feature-sha"
          df -h "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned workspace dependencies and Rust preflight
        shell: bash
        run: |
          set -euo pipefail
          pnpm --version
          node --version
          pnpm install --frozen-lockfile
          curl -fsSL https://mise.run | MISE_VERSION=v2026.10.4 sh
          "$HOME/.local/bin/mise" install rust@1.96.0
          "$HOME/.local/bin/mise" exec rust@1.96.0 -- rustc --version
          "$HOME/.local/bin/mise" exec rust@1.96.0 -- cargo --version
      - name: Start rootless Docker with delegated controllers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y uidmap slirp4netns docker-ce-rootless-extras dbus-user-session
          user_name=$(id -un)
          for kind in uid gid; do
            file="/etc/sub${kind}"
            if ! awk -F: -v user="$user_name" '$1 == user && $3 >= 65536 { found=1 } END { exit !found }' "$file"; then
              first=$(awk -F: 'BEGIN { high=100000 } $2 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ { end=$2+$3; if (end>high) high=end } END { print high }' "$file")
              last=$((first + 65535))
              sudo usermod "--add-sub${kind}s" "$first-$last" "$user_name"
            fi
          done
          sudo install -d -m 755 /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=cpu cpuset io memory pids\n' | sudo tee /etc/systemd/system/user@.service.d/delegate.conf >/dev/null
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$user_name"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
          unset DOCKER_CONTEXT || true
          printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=%s\nDOCKER_HOST=%s\n' "$XDG_RUNTIME_DIR" "$DBUS_SESSION_BUS_ADDRESS" "$DOCKER_HOST" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            test -S "$XDG_RUNTIME_DIR/bus" && break
            sleep 1
          done
          test -S "$XDG_RUNTIME_DIR/bus"
          controllers=$(cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers")
          for controller in cpu memory pids; do
            case " $controllers " in *" $controller "*) ;; *) echo "Missing delegated controller: $controller" >&2; exit 1 ;; esac
          done
          dockerd-rootless-setuptool.sh install --force
          systemctl --user is-active --quiet docker.service
          docker version
          docker info --format '{{json .}}' | tee "$RUNNER_TEMP/freshagent-parity-proof/docker-info.json" | jq -e '.CgroupDriver == "systemd" and .CgroupVersion == "2" and (.SecurityOptions | any(contains("rootless")))' >/dev/null
      - name: Run the exact installed Codex recovery test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FEATURE_SHA"
          printf '%s\n' focused-test-started > "$RUNNER_TEMP/freshagent-parity-proof/phase"
          pnpm run test:vitest run test/integration/server/fresh-agent-parity.test.ts --config config/vitest/vitest.config.ts --maxWorkers 1 --testNamePattern 'uses the installed wrapper for catalog, settings, saved output and exact native controls' --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/freshagent-parity-proof/test.log"
          grep -F 'uses the installed wrapper for catalog, settings, saved output and exact native controls' "$RUNNER_TEMP/freshagent-parity-proof/test.log"
          grep -E 'Tests +1 passed' "$RUNNER_TEMP/freshagent-parity-proof/test.log"
          printf '%s\n' focused-test-passed > "$RUNNER_TEMP/freshagent-parity-proof/phase"
      - name: Capture Docker diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/freshagent-parity-proof"
          systemctl --user status docker.service --no-pager > "$RUNNER_TEMP/freshagent-parity-proof/docker-status.log" 2>&1 || true
          journalctl --user -u docker.service --no-pager > "$RUNNER_TEMP/freshagent-parity-proof/docker-journal.log" 2>&1 || true
          df -h "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/freshagent-parity-proof/disk.log" 2>&1 || true
      - name: Retain test and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshagent-managed-codex-parity-8ab
          path: |
            ${{ runner.temp }}/freshagent-parity-proof/
            .runtime-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Stop this runner's rootless Docker service
        if: always()
        shell: bash
        run: systemctl --user stop docker.service || true
