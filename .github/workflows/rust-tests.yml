name: Codex control notice regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-control-notice-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '6f33b90c98ad03eb5c43a83c859dbb19daeef7b6'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Codex control notice regressions
        run: pnpm run test:vitest run test/unit/client/store/freshAgentLiveSlice.test.ts --config config/vitest/vitest.config.ts -t 'keeps user-facing feedback when|preserves notices with a matching code from another provider'
