name: Claude reissued Stop readiness proof

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRESHELL_PROOF_FEATURE_COMMIT: 4aeb5c5e017351b675dba368eb960f2ae01f3bf5

jobs:
  interrupt-parallel:
    name: Repeated full Claude interrupt integration test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify proof source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          printf '%s\n' '.github/workflows/rust-tests.yml' 'crates/freshell-ws/tests/common/log_capture.rs' 'crates/freshell-ws/tests/freshagent_claude_kill_interrupt.rs' > "$RUNNER_TEMP/expected"
          git diff --name-only "$FRESHELL_PROOF_FEATURE_COMMIT" HEAD > "$RUNNER_TEMP/actual"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repeat full interrupt test binary inside disposable runtime sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/claude-stop-proof"
          scripts/sandbox-test.sh --runtime-suite 'set -euo pipefail; unset RUST_TEST_THREADS; export CARGO_BUILD_JOBS=2; for attempt in $(seq 1 10); do printf "interrupt binary attempt %s of 10\n" "$attempt"; cargo test --locked -p freshell-ws --test freshagent_claude_kill_interrupt -- --nocapture; done' 2>&1 | tee "$RUNNER_TEMP/claude-stop-proof/interrupts.log"
      - name: Retain complete output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-stop-readiness-proof
          path: ${{ runner.temp }}/claude-stop-proof/
          if-no-files-found: warn
          retention-days: 7
