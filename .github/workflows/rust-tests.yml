name: OpenCode exec readiness proof

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRESHELL_PROOF_FEATURE_COMMIT: 3757b1e806f84d9e775f5010eb930f39c299e552

jobs:
  sessions-parallel:
    name: Parallel sessions library and owned pipe regressions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify proof source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          test "$(git diff --name-only "$FRESHELL_PROOF_FEATURE_COMMIT" HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run sessions library and regressions in the disposable sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opencode-exec-proof"
          scripts/sandbox-test.sh --runtime-suite 'set -euo pipefail; unset RUST_TEST_THREADS; export CARGO_BUILD_JOBS=2; cargo test --locked -p freshell-sessions --lib -- --nocapture; cargo test --locked -p freshell-sessions --lib opencode_transfer::workspace_metadata_test_hooks::exec_readiness_reports_a_live_process_whose_executable_does_not_change -- --exact --nocapture | tee /tmp/exec-readiness.log; grep -q "^running 1 test$" /tmp/exec-readiness.log; cargo test --locked -p freshell-sessions --lib opencode_transfer::workspace_metadata_test_hooks::owned_pipe_meter_counts_a_close_on_exec_duplicate_in_an_execed_child -- --exact --nocapture | tee /tmp/pipe-duplicate.log; grep -q "^running 1 test$" /tmp/pipe-duplicate.log' 2>&1 | tee "$RUNNER_TEMP/opencode-exec-proof/sessions.log"
      - name: Retain complete output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-exec-proof
          path: ${{ runner.temp }}/opencode-exec-proof/
          if-no-files-found: warn
          retention-days: 7
