name: Verify accepted receipt and turn identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  view-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'f017efda904e088c23b19a3c8220ad2d3c5fed26'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run --silent typecheck
      - name: Run full view and approval suites
        run: >-
          pnpm run test:vitest run test/unit/client/components/fresh-agent/FreshAgentView.test.tsx
          test/unit/client/components/fresh-agent/FreshAgentView.approvals.test.tsx
          --config config/vitest/vitest.config.ts
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [landed, same_text_refresh, batched, native_id]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'f017efda904e088c23b19a3c8220ad2d3c5fed26'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Break the selected guard
        env:
          MUTANT_MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('src/components/fresh-agent/FreshAgentView.tsx')
          source = path.read_text(encoding='utf-8')
          mutations = {
              'landed': [('if (!localEchoLanded(turns, recoveredEcho, pending, {',
                          'if (true || !localEchoLanded(turns, recoveredEcho, pending, {')],
              'same_text_refresh': [
                  ('const canMatchText = Boolean(needle) && !submittedTurnId && (',
                   'const canMatchText = Boolean(needle) && ('),
                  ('allowTextMatch: true, previousTurnKeys: new Set(boundary),',
                   'allowTextMatch: false, previousTurnKeys: new Set(boundary),'),
              ],
              'batched': [
                  ('if (!pending?.deliveryAmbiguous && current.pendingLocalEcho?.requestId === message.requestId) {',
                   'if (echo?.requestId === message.requestId) {'),
                  ('setLocalEcho({ ...current.pendingLocalEcho, submittedTurnId })',
                   'setLocalEcho({ ...echo, submittedTurnId })'),
              ],
              'native_id': [(' || turn.nativeTurnId === submittedTurnId', '')],
          }
          for before, after in mutations[os.environ['MUTANT_MODE']]:
              if source.count(before) != 1:
                  raise SystemExit('Mutation anchor missing or ambiguous')
              source = source.replace(before, after)
          path.write_text(source, encoding='utf-8')
          PY
          git diff --stat -- src/components/fresh-agent/FreshAgentView.tsx
      - name: Require the matching regression to fail
        env:
          MUTANT_MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MUTANT_MODE" in
            landed) pattern='does not duplicate a landed prompt when acceptance follows materialization with a settled snapshot'; failures='Failed Tests 1' ;;
            same_text_refresh) pattern='keeps the accepted echo when only a different same-text turn has landed'; failures='Failed Tests 1' ;;
            batched) pattern='does not resurrect a landed echo when'; failures='Failed Tests 2' ;;
            native_id) pattern='recognizes a landed split Codex user row by its native turn ID on delayed acceptance'; failures='Failed Tests 1' ;;
          esac
          set +e
          pnpm run test:vitest run test/unit/client/components/fresh-agent/FreshAgentView.test.tsx --config config/vitest/vitest.config.ts -t "$pattern" > mutant.log 2>&1
          status=$?
          set -e
          cat mutant.log
          test "$status" -ne 0
          grep -F "$failures" mutant.log
          grep -F 'AssertionError' mutant.log
