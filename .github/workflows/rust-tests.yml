name: Codex notice rebind duplicate regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebind-duplicate-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '62b1a166c570bdda09eeee139b1b17129753d751'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run rebind duplicate regression
        run: pnpm run test:vitest run test/unit/client/components/fresh-agent/FreshAgentView.test.tsx --config config/vitest/vitest.config.ts -t 'does not revive a duplicate Codex notice after a same-session rebind'
