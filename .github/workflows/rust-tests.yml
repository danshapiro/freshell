name: FreshAgent send-scope verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '96ef7adc84913708c94c0e17d34189b5c56d6ae5'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run --silent typecheck
      - name: Run scoped send and checkpoint regressions
        run: >-
          pnpm run test:vitest run test/unit/client/components/fresh-agent/FreshAgentView.test.tsx
          --config config/vitest/vitest.config.ts
          -t 'during a same-batch conversation switch|does not show a previous conversation send as a checkpoint|restores an uncertain send after the same conversation materializes'
