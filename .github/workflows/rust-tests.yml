name: FreshAgent blocked send green proof
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  FRESHELL_PROOF_FEATURE_COMMIT: d13d2e08b8da12a1c5b14b9f0dfe32b8db3ddab6
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '1'
  CARGO_TERM_COLOR: never
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify feature parent and proof-only workflow
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Supervisor blocked input cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blocked-send-green"
          cargo test --locked -p freshell-supervisor --lib blocked_send -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/blocked-send-green/supervisor.log"
          grep -q '^running 2 tests$' "$RUNNER_TEMP/blocked-send-green/supervisor.log"
      - name: Existing queued refusal replay
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p freshell-supervisor --lib queued_fresh_agent_refusal_is_not_misclassified_as_ambiguous_or_replayed -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/blocked-send-green/queued-replay.log"
          grep -q '^running 1 test$' "$RUNNER_TEMP/blocked-send-green/queued-replay.log"
      - name: Hosted gateway send tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p freshell-server --features managed-runtime-v1 --bin freshell-server fresh_agent_proxy::tests::send_tests -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/blocked-send-green/gateway.log"
          grep -Eq '^running [1-9][0-9]* tests?$' "$RUNNER_TEMP/blocked-send-green/gateway.log"
      - name: Mutation proves queued work stays uncertain
        shell: bash
        run: |
          set -euo pipefail
          cp crates/freshell-supervisor/src/registry.rs "$RUNNER_TEMP/blocked-send-green/original-registry.rs"
          python3 -c 'from pathlib import Path; p=Path("crates/freshell-supervisor/src/registry.rs"); s=p.read_text(); needle="AND NOT EXISTS (SELECT 1 FROM input_commands c WHERE c.soul_id=s.soul_id AND c.request_id=?2)"; assert s.count(needle)==1; p.write_text(s.replace(needle, "AND (?2 IS NOT NULL)", 1))'
          set +e
          cargo test --locked -p freshell-supervisor --lib blocked_send_preserves_existing_queued_ambiguous_and_accepted_outcomes -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/blocked-send-green/mutant-queued.log"
          status=${PIPESTATUS[0]}
          set -e
          cp "$RUNNER_TEMP/blocked-send-green/original-registry.rs" crates/freshell-supervisor/src/registry.rs
          rm "$RUNNER_TEMP/blocked-send-green/original-registry.rs"
          test "$status" -ne 0
          grep -q 'a queued request can still be replayed' "$RUNNER_TEMP/blocked-send-green/mutant-queued.log"
          grep -q 'test result: FAILED. 0 passed; 1 failed' "$RUNNER_TEMP/blocked-send-green/mutant-queued.log"
      - name: Mutation proves post-dispatch failures stay uncertain
        shell: bash
        run: |
          set -euo pipefail
          cp crates/freshell-server/src/fresh_agent_proxy.rs "$RUNNER_TEMP/blocked-send-green/original-gateway.rs"
          python3 -c 'from pathlib import Path; p=Path("crates/freshell-server/src/fresh_agent_proxy.rs"); s=p.read_text(); needle="        Err(_) => HostedSendOutcome::Ambiguous(ambiguous()),"; assert s.count(needle)==1; p.write_text(s.replace(needle, "        Err(ClientError::Runtime { code: RuntimeErrorCode::UnknownSoul, .. }) => HostedSendOutcome::Refused(refused()),\n" + needle, 1))'
          set +e
          cargo test --locked -p freshell-server --features managed-runtime-v1 --bin freshell-server hosted_unknown_soul_after_host_dispatch_remains_uncertain -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/blocked-send-green/mutant-after-dispatch.log"
          status=${PIPESTATUS[0]}
          set -e
          cp "$RUNNER_TEMP/blocked-send-green/original-gateway.rs" crates/freshell-server/src/fresh_agent_proxy.rs
          rm "$RUNNER_TEMP/blocked-send-green/original-gateway.rs"
          test "$status" -ne 0
          grep -q 'hosted_unknown_soul_after_host_dispatch_remains_uncertain' "$RUNNER_TEMP/blocked-send-green/mutant-after-dispatch.log"
          grep -q 'test result: FAILED. 0 passed; 1 failed' "$RUNNER_TEMP/blocked-send-green/mutant-after-dispatch.log"
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blocked-send-green-proof
          path: ${{ runner.temp }}/blocked-send-green/
          if-no-files-found: warn
          retention-days: 7
