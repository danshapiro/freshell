name: OpenCode descriptor diagnostic proof

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRESHELL_PROOF_FEATURE_COMMIT: cd38797d0d6728ad5541ca248273170dd7987195

jobs:
  sessions-parallel:
    name: Full sessions library with descriptor diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify proof source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          printf '%s\n' '.github/workflows/rust-tests.yml' 'crates/freshell-sessions/src/opencode_transfer.rs' > "$RUNNER_TEMP/proof-expected-paths"
          git diff --name-only "$FRESHELL_PROOF_FEATURE_COMMIT" HEAD > "$RUNNER_TEMP/proof-actual-paths"
          diff -u "$RUNNER_TEMP/proof-expected-paths" "$RUNNER_TEMP/proof-actual-paths"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full sessions library in disposable runtime sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opencode-diagnostic"
          scripts/sandbox-test.sh --runtime-suite 'CARGO_BUILD_JOBS=2 cargo test --locked -p freshell-sessions --lib -- --nocapture' 2>&1 | tee "$RUNNER_TEMP/opencode-diagnostic/sessions-parallel.log"
      - name: Retain complete output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-diagnostic-proof
          path: ${{ runner.temp }}/opencode-diagnostic/
          if-no-files-found: warn
          retention-days: 7
