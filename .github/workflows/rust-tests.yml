name: Verify accepted receipt correlation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  view-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '04bc72260d59c9747d4cb71502cae69a74f07065'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run --silent typecheck
      - name: Run full view and approval suites
        run: >-
          pnpm run test:vitest run test/unit/client/components/fresh-agent/FreshAgentView.test.tsx
          test/unit/client/components/fresh-agent/FreshAgentView.approvals.test.tsx
          --config config/vitest/vitest.config.ts
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [landed, same_text, batched]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '04bc72260d59c9747d4cb71502cae69a74f07065'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Break the selected guard
        env:
          MUTANT_MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('src/components/fresh-agent/FreshAgentView.tsx')
          source = path.read_text(encoding='utf-8')
          mutations = {
              'landed': ('if (!localEchoLanded(turns, recoveredEcho, pending, {',
                         'if (true || !localEchoLanded(turns, recoveredEcho, pending, {'),
              'same_text': ('allowTextMatch: !submittedTurnId, previousTurnKeys: new Set(boundary),',
                            'allowTextMatch: true, previousTurnKeys: new Set(boundary),'),
              'batched': ('if (!pending?.deliveryAmbiguous && echo?.requestId === message.requestId',
                          'if (echo?.requestId === message.requestId'),
          }
          before, after = mutations[os.environ['MUTANT_MODE']]
          if source.count(before) != 1:
              raise SystemExit('Mutation anchor missing or ambiguous')
          path.write_text(source.replace(before, after), encoding='utf-8')
          PY
          git diff --stat -- src/components/fresh-agent/FreshAgentView.tsx
      - name: Require the matching regression to fail
        env:
          MUTANT_MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MUTANT_MODE" in
            landed) pattern='does not duplicate a landed prompt when acceptance follows materialization with a settled snapshot' ;;
            same_text) pattern='keeps the accepted echo when only a different same-text turn has landed' ;;
            batched) pattern='does not resurrect a landed echo when uncertainty and acceptance arrive in the same batch' ;;
          esac
          set +e
          pnpm run test:vitest run test/unit/client/components/fresh-agent/FreshAgentView.test.tsx --config config/vitest/vitest.config.ts -t "$pattern" > mutant.log 2>&1
          status=$?
          set -e
          cat mutant.log
          test "$status" -ne 0
          grep -F 'Failed Tests 1' mutant.log
          grep -F 'AssertionError' mutant.log
