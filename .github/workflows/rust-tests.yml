name: Verify duplicate prompt regression detects broken guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landed-echo-mutant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify mutant parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'df382143536649a0e17bc22e6491cdd57fa14a09'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run duplicate prompt regression
        run: >-
          pnpm run test:vitest run test/unit/client/components/fresh-agent/FreshAgentView.test.tsx
          --config config/vitest/vitest.config.ts
          -t 'does not duplicate a landed prompt when acceptance follows materialization'
