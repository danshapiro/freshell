name: FreshAgent Rust failure proof

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRESHELL_PROOF_FEATURE_COMMIT: cd38797d0d6728ad5541ca248273170dd7987195

jobs:
  claude-writer:
    name: Full Claude writer integration test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          test "$(git diff --name-only "$FRESHELL_PROOF_FEATURE_COMMIT" HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Run writer tests in the disposable runtime sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/freshagent-rust-proof"
          scripts/sandbox-test.sh --runtime-suite 'CARGO_BUILD_JOBS=2 cargo test --locked -p freshell-ws --test freshagent_claude_writer -- --nocapture' 2>&1 | tee "$RUNNER_TEMP/freshagent-rust-proof/claude-writer.log"
      - name: Retain writer output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-writer-proof
          path: ${{ runner.temp }}/freshagent-rust-proof/
          if-no-files-found: warn
          retention-days: 7

  opencode-descriptors:
    name: Repeated OpenCode descriptor test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          test "$(git diff --name-only "$FRESHELL_PROOF_FEATURE_COMMIT" HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Repeat exact descriptor test in the disposable runtime sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/freshagent-rust-proof"
          scripts/sandbox-test.sh --runtime-suite 'set -euo pipefail; for attempt in $(seq 1 10); do printf "descriptor attempt %s of 10\n" "$attempt"; CARGO_BUILD_JOBS=2 cargo test --locked -p freshell-sessions --lib opencode_transfer::native_source_inventory_tests::workspace_metadata_complete_export_measures_owned_process_pipe_and_drainer_peaks -- --exact --nocapture; done' 2>&1 | tee "$RUNNER_TEMP/freshagent-rust-proof/opencode-descriptors.log"
      - name: Retain descriptor output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-descriptor-proof
          path: ${{ runner.temp }}/freshagent-rust-proof/
          if-no-files-found: warn
          retention-days: 7
