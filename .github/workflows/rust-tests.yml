name: FreshAgent blocked send red proof
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  FRESHELL_PROOF_FEATURE_COMMIT: a40449695d05f48d9f3b43a8ceeb0ad661211b66
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '1'
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify feature parent and proof-only workflow
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Supervisor admission outcomes
        id: supervisor
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/blocked-send-proof"
          cargo test --locked -p freshell-supervisor --lib blocked_send -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/blocked-send-proof/supervisor.log"
      - name: Gateway new and queued sends
        id: gateway
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p freshell-server --features managed-runtime-v1 --bin freshell-server hosted_blocked_send_distinguishes_new_from_queued_input -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/blocked-send-proof/gateway.log"
      - name: Later host error remains uncertain
        if: always() && steps.gateway.outcome != 'skipped'
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p freshell-server --features managed-runtime-v1 --bin freshell-server hosted_unknown_soul_after_host_dispatch_remains_uncertain -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/blocked-send-proof/after-dispatch.log"
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blocked-send-red-proof
          path: ${{ runner.temp }}/blocked-send-proof/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify both new-send checks failed
        if: always()
        run: |
          test '${{ steps.supervisor.outcome }}' = failure
          test '${{ steps.gateway.outcome }}' = failure
