name: OpenCode drainer identity diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRESHELL_PROOF_FEATURE_COMMIT: 151b12b8e9f282331b339d3b66e5faf888ed0750

jobs:
  drainer-diagnostic:
    name: Parallel sessions drainer identity diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify proof source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' .github/workflows/rust-tests.yml crates/freshell-sessions/src/opencode_transfer.rs)"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repeat full sessions library in disposable sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/drainer-diagnostic"
          scripts/sandbox-test.sh --runtime-suite 'set -euo pipefail; unset RUST_TEST_THREADS; export CARGO_BUILD_JOBS=2; for attempt in 1 2 3; do echo "Full parallel sessions attempt $attempt"; cargo test --locked -p freshell-sessions --lib -- --nocapture; done' 2>&1 | tee "$RUNNER_TEMP/drainer-diagnostic/sessions.log"
      - name: Retain complete output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-drainer-diagnostic
          path: ${{ runner.temp }}/drainer-diagnostic/
          if-no-files-found: warn
          retention-days: 7
