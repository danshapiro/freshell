name: FreshAgent client regression verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '240a74ba1921510707bdab179e260aef042069d2'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run --silent typecheck
      - name: Run affected client regressions
        run: >-
          pnpm run test:vitest run
          test/unit/client/components/fresh-agent/FreshAgentView.approvals.test.tsx
          test/unit/client/components/fresh-agent/FreshAgentView.reconcile.test.tsx
          test/unit/client/components/fresh-agent/FreshAgentView.test.tsx
          test/unit/client/components/fresh-agent/FreshAgentView.live-tail.test.tsx
          test/unit/client/components/fresh-agent/FreshAgentNoticeStack.test.tsx
          test/unit/client/components/fresh-agent/FreshAgentApprovalBanner.test.tsx
          test/unit/client/lib/fresh-agent-transcript-projection.test.ts
          test/unit/client/store/freshAgentLiveSlice.test.ts
          test/unit/client/fresh-agent-ws.test.ts
          test/unit/client/lib/fresh-agent-ws.test.ts
          test/unit/client/store/freshAgentSlice.test.ts
          test/unit/client/components/fresh-agent/FreshAgentChildObserver.test.tsx
          --config config/vitest/vitest.config.ts --reporter=dot --maxWorkers=1
