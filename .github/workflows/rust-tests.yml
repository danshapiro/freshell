name: Rust Tests

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

# Server-side enforcement for the class of red that landed via PR #795:
# nothing between commit and main ran `cargo test`, so 11 failing freshagent
# unit tests merged with every advisory check green. The pre-push gate now
# runs targeted cargo tests locally (scripts/hooks/pre-push); this workflow
# is the merge-time backstop that cannot be bypassed with --no-verify.
#
# The `gate` job always reports, so it can be a required status check without
# blocking PRs that touch no Rust (a paths-filtered workflow would leave the
# required check stuck on "Expected" forever).

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Rust changes
        id: filter
        run: |
          # Manager and dependency configuration changes must exercise the
          # Rust suite too: it spawns Node fixtures (the codex fake
          # app-server imports `ws`) whose behavior depends on the installed
          # dependency tree. A rust-gate that skips because no .rs file
          # changed is not proof of fixture compatibility. Scoped to the
          # root and workspace members — the independent demo locks are
          # not part of the workspace dependency tree.
          # `github.base_ref` exists only for pull_request events; manual
          # dispatch (the event-routing escape hatch) compares against the
          # default branch instead.
          BASE="${{ github.base_ref }}"
          [ -n "$BASE" ] || BASE="main"
          if git diff --name-only "origin/$BASE...${{ github.sha }}" \
            | grep -Eq '\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain|^\.cargo/|^test/fixtures/|^(pnpm-lock\.yaml|pnpm-workspace\.yaml|package(-lock)?\.json|\.npmrc)$|^(crates|packages)/.*package(-lock)?\.json$|^packages/'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  rust-tests:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      # The Rust suite spawns Node test fixtures (the codex fake app-server
      # imports `ws`), so this job needs the workspace dependencies installed
      # or those tests die at fixture boot ("fake app-server exited before
      # listening").
      # Pinned revision of the v4 major; reads the exact version from the root
      # packageManager pin (no floating duplicate).
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies (Rust test fixtures)
        run: pnpm install --frozen-lockfile
      - name: Workspace tests
        run: cargo test --workspace --exclude freshell-tauri --locked
      # The runner has a user systemd manager, so the run above selects the
      # systemd containment backend. Linux hosts without one get the tag
      # backend, which CI must prove too: without XDG_RUNTIME_DIR the systemd
      # probe fails and the tag backend is selected (its
      # `selection_matches_the_host` test prints which one).
      - name: Containment and WS tests on the tag containment backend
        run: env -u XDG_RUNTIME_DIR -u DBUS_SESSION_BUS_ADDRESS cargo test -p freshell-containment -p freshell-ws --locked

  gate:
    name: rust-gate
    needs: [changes, rust-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        run: |
          if [ "${{ needs.changes.outputs.rust }}" = "false" ]; then
            echo "no Rust changes in this PR — rust tests skipped"
            exit 0
          fi
          if [ "${{ needs.rust-tests.result }}" = "success" ]; then
            echo "workspace rust tests passed"
            exit 0
          fi
          echo "workspace rust tests failed or did not run"
          exit 1
