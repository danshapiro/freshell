name: FreshAgent final pre-push checks

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FEATURE_SHA: c8abd64420ed36237ba9b0440b9dc74fa60e9f5a
  CARGO_BUILD_JOBS: '1'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact feature source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FEATURE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check workspace Clippy
        run: cargo clippy --workspace --exclude freshell-tauri --all-targets -- -D warnings
      - name: Typecheck
        run: pnpm run --silent typecheck
