name: FreshAgent acceptance scope and echo verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'df382143536649a0e17bc22e6491cdd57fa14a09'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run --silent typecheck
      - name: Run acceptance and send-scope regressions
        run: >-
          pnpm run test:vitest run test/unit/client/components/fresh-agent/FreshAgentView.test.tsx
          --config config/vitest/vitest.config.ts
          -t 'conversation acceptance|conversation materializes in the same batch|does not duplicate a landed prompt|does not restore a previous conversation|restores an uncertain send after|keeps.*uncertain delivery|resolves a hosted.*receipt'
