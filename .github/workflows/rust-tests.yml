name: FreshAgent accepted-turn identity regressions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accepted-turns:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'bb377092ebe6aae02ebf52b11b3da06469cf518b'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run accepted-turn identity regressions
        run: >-
          pnpm run test:vitest run test/unit/client/components/fresh-agent/FreshAgentView.test.tsx
          --config config/vitest/vitest.config.ts
          -t 'does not duplicate a landed prompt when acceptance follows materialization|keeps the accepted echo when only a different same-text turn has landed|does not resurrect a landed echo when uncertainty and acceptance arrive in the same batch'
