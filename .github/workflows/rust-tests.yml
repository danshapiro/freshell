name: Verify steering acceptance boundaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  view-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '89a7721dea833bac96d81928ba605071098e5a45'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run --silent typecheck
      - name: Run focused acceptance and steering cases
        run: >-
          pnpm run test:vitest run test/unit/client/components/fresh-agent/FreshAgentView.test.tsx
          --config config/vitest/vitest.config.ts
          -t 'steered|steering|same-text|landed prompt|landed split Codex|resurrect a landed echo|conversation acceptance|conversation materializes in the same batch|resolves a hosted.*receipt|newer live projection'
      - name: Run full view and approval suites
        run: >-
          pnpm run test:vitest run test/unit/client/components/fresh-agent/FreshAgentView.test.tsx
          test/unit/client/components/fresh-agent/FreshAgentView.approvals.test.tsx
          --config config/vitest/vitest.config.ts
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [boundary, idle_match, running_match, ambiguous, status_race, projection_boundary, stale_idle, full_text, live_ambiguity]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '89a7721dea833bac96d81928ba605071098e5a45'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Break the selected steering guard
        env:
          MUTANT_MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('src/components/fresh-agent/FreshAgentView.tsx')
          source = path.read_text(encoding='utf-8')
          mutations = {
              'boundary': ("return key.endsWith(':row-0') && previousTurnKeys.has(key.slice(0, -':row-0'.length))", 'return false'),
              'idle_match': ('return options.allowSettledTextMatch === true\n      && countNewNativeTextMatches(userTurns, echo, submittedTurnId, previousTurnKeys) === 1',
                             'return false'),
              'running_match': ('return options.allowSettledTextMatch === true\n      && countNewNativeTextMatches(userTurns, echo, submittedTurnId, previousTurnKeys) === 1',
                                'return countNewNativeTextMatches(userTurns, echo, submittedTurnId, previousTurnKeys) === 1'),
              'ambiguous': ('&& !ambiguousNativeEcho', '&& true'),
              'status_race': ('const ambiguousNativeEcho = Boolean(echo && echoSubmittedTurnId', 'const ambiguousNativeEcho = Boolean(echo && echoSubmittedTurnId && allowSettledTextMatch'),
              'projection_boundary': ('mergeFreshAgentTranscriptProjection(currentSnapshot, liveProjection)', 'currentSnapshot.turns'),
              'stale_idle': ('const snapshotCoversLiveProjection = !liveProjection || Boolean(projectionMetadata', 'const snapshotCoversLiveProjection = true || !liveProjection || Boolean(projectionMetadata'),
              'full_text': ('freshAgentTurnText(turn).trim() === text', 'echoTextMatchesTurn(echo.text, echo.text.slice(0, 80), freshAgentTurnText(turn))'),
              'live_ambiguity': ('const displayTurns = mergeFreshAgentTranscriptProjection(displaySnapshot, liveProjection)', 'const displayTurns = displaySnapshot.turns'),
          }
          before, after = mutations[os.environ['MUTANT_MODE']]
          if source.count(before) != 1:
              raise SystemExit('Mutation anchor missing or ambiguous')
          source = source.replace(before, after)
          if os.environ['MUTANT_MODE'] == 'live_ambiguity':
              before = 'const snapshotCoversLiveProjection = !liveProjection || Boolean(projectionMetadata'
              if source.count(before) != 1:
                  raise SystemExit('Coverage mutation anchor missing or ambiguous')
              source = source.replace(before, 'const snapshotCoversLiveProjection = true || !liveProjection || Boolean(projectionMetadata')
          path.write_text(source, encoding='utf-8')
          PY
          git diff --stat -- src/components/fresh-agent/FreshAgentView.tsx
      - name: Require the matching regression to fail
        env:
          MUTANT_MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MUTANT_MODE" in
            boundary) pattern='keeps a steered echo visible when an earlier matching row shares its native turn ID' ;;
            idle_match|running_match) pattern='settles a uniquely matching steered row at authoritative idle and releases queued work' ;;
            ambiguous) pattern='keeps an ambiguous steered echo when multiple new user rows have the same text' ;;
            status_race) pattern='keeps an ambiguous steered echo when an idle status update races a snapshot' ;;
            projection_boundary) pattern='keeps a steered echo visible beside an earlier row from the live projection' ;;
            stale_idle) pattern='does not settle steering from an older idle snapshot after newer live activity' ;;
            full_text) pattern='settles the full matching steered prompt when another new prompt shares its first 80 characters' ;;
            live_ambiguity) pattern='keeps an ambiguous echo when a newer live projection adds a second matching row' ;;
          esac
          set +e
          pnpm run test:vitest run test/unit/client/components/fresh-agent/FreshAgentView.test.tsx --config config/vitest/vitest.config.ts -t "$pattern" > mutant.log 2>&1
          status=$?
          set -e
          cat mutant.log
          test "$status" -ne 0
          grep -F 'Failed Tests 1' mutant.log
          grep -F 'AssertionError' mutant.log
