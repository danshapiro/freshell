name: Notice toggle memo regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice-toggle-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact proof parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'bed8ed764b56e0c160f650042f42a4d9fe1cbb15'
          printf '%s\n' '.github/workflows/rust-tests.yml' 'src/components/fresh-agent/FreshAgentView.tsx' > "$RUNNER_TEMP/expected-files"
          git diff --name-only HEAD^ HEAD > "$RUNNER_TEMP/changed-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run notice lifetime regression
        run: pnpm run test:vitest run test/unit/client/components/fresh-agent/FreshAgentView.test.tsx --config config/vitest/vitest.config.ts -t 'keeps a Codex provider error until dismissed while routine notices still expire'
