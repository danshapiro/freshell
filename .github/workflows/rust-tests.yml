name: FreshAgent durable blocked send proof
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  FRESHELL_PROOF_FEATURE_COMMIT: 2b2ef61c87d1ecaed7d1ec98da4ea7866139c941
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '1'
  CARGO_TERM_COLOR: never
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify feature parent and proof-only workflow
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/rust-tests.yml'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Blocked send and replay correlation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/durable-blocked-send"
          cargo test --locked -p freshell-supervisor --lib blocked_send -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/durable-blocked-send/supervisor.log"
          grep -q '^running 3 tests$' "$RUNNER_TEMP/durable-blocked-send/supervisor.log"
      - name: Verified loss cleanup retains refusal
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p freshell-supervisor --lib verified_loss_cleanup_preserves_an_unadmitted_send_refusal -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/durable-blocked-send/loss.log"
          grep -q '^running 1 test$' "$RUNNER_TEMP/durable-blocked-send/loss.log"
      - name: Initial source checks keep queued input protection
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p freshell-supervisor --lib input_reservation_refused_tests -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/durable-blocked-send/source.log"
          grep -q '^running 2 tests$' "$RUNNER_TEMP/durable-blocked-send/source.log"
      - name: Existing queued refusal replay
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p freshell-supervisor --lib queued_fresh_agent_refusal_is_not_misclassified_as_ambiguous_or_replayed -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/durable-blocked-send/queued-replay.log"
          grep -q '^running 1 test$' "$RUNNER_TEMP/durable-blocked-send/queued-replay.log"
      - name: Hosted gateway send tests and recovery replay
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p freshell-server --features managed-runtime-v1 --bin freshell-server fresh_agent_proxy::tests::send_tests -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/durable-blocked-send/gateway.log"
          grep -q '^running 13 tests$' "$RUNNER_TEMP/durable-blocked-send/gateway.log"
      - name: Mutation proves queued requests cannot be replaced
        shell: bash
        run: |
          set -euo pipefail
          cp crates/freshell-supervisor/src/registry.rs "$RUNNER_TEMP/durable-blocked-send/original-registry.rs"
          python3 -c 'from pathlib import Path; p=Path("crates/freshell-supervisor/src/registry.rs"); s=p.read_text(); a="AND NOT EXISTS (SELECT 1 FROM input_commands c WHERE c.soul_id=s.soul_id AND c.request_id=?2)"; b="INSERT INTO input_commands (soul_id,request_id,payload_digest,protected_payload,incarnation_id,state,fresh_agent_send_refusal"; assert s.count(a)==1 and s.count(b)==1; p.write_text(s.replace(a,"AND (?2 IS NOT NULL)",1).replace(b,b.replace("INSERT INTO","INSERT OR REPLACE INTO"),1))'
          set +e
          cargo test --locked -p freshell-supervisor --lib blocked_send_preserves_existing_queued_ambiguous_and_accepted_outcomes -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/durable-blocked-send/mutant-queued.log"
          status=${PIPESTATUS[0]}
          set -e
          cp "$RUNNER_TEMP/durable-blocked-send/original-registry.rs" crates/freshell-supervisor/src/registry.rs
          rm "$RUNNER_TEMP/durable-blocked-send/original-registry.rs"
          test "$status" -ne 0
          grep -q 'a queued request can still be replayed' "$RUNNER_TEMP/durable-blocked-send/mutant-queued.log"
          grep -q 'test result: FAILED. 0 passed; 1 failed' "$RUNNER_TEMP/durable-blocked-send/mutant-queued.log"
      - name: Mutation proves refusal does not inflate accepted count
        shell: bash
        run: |
          set -euo pipefail
          cp crates/freshell-supervisor/src/registry.rs "$RUNNER_TEMP/durable-blocked-send/original-registry.rs"
          python3 -c 'from pathlib import Path; p=Path("crates/freshell-supervisor/src/registry.rs"); s=p.read_text(); a="COALESCE(SUM(CASE WHEN state!=\x27refused_before_admission\x27 THEN 1 ELSE 0 END),0)"; assert s.count(a)==1; p.write_text(s.replace(a,"COUNT(*)",1))'
          set +e
          cargo test --locked -p freshell-supervisor --lib new_blocked_send_is_refused_with_the_available_recovery_reason -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/durable-blocked-send/mutant-count.log"
          status=${PIPESTATUS[0]}
          set -e
          cp "$RUNNER_TEMP/durable-blocked-send/original-registry.rs" crates/freshell-supervisor/src/registry.rs
          rm "$RUNNER_TEMP/durable-blocked-send/original-registry.rs"
          test "$status" -ne 0
          grep -q 'test result: FAILED. 0 passed; 1 failed' "$RUNNER_TEMP/durable-blocked-send/mutant-count.log"
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-blocked-send-green-proof
          path: ${{ runner.temp }}/durable-blocked-send/
          if-no-files-found: warn
          retention-days: 7
