name: FreshAgent supplementary proof

# This file is intended only for a disposable proof ref. The unchanged
# feature ref runs the full workspace workflow separately.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRESHELL_PROOF_FEATURE_COMMIT: d13d2e08b8da12a1c5b14b9f0dfe32b8db3ddab6
  CARGO_BUILD_JOBS: '1'
  RUST_TEST_THREADS: '1'
  TOKIO_WORKER_THREADS: '2'

jobs:
  prepush-checks:
    name: Supplementary pre-push checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify proof commit and feature parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          test "$(git diff --name-only "$FRESHELL_PROOF_FEATURE_COMMIT" HEAD)" = '.github/workflows/rust-tests.yml'
          printf 'Proof commit: %s\nFeature commit: %s\n' "$GITHUB_SHA" "$FRESHELL_PROOF_FEATURE_COMMIT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check workspace Clippy
        run: cargo clippy --workspace --exclude freshell-tauri --all-targets -- -D warnings
      - name: Typecheck
        run: pnpm run --silent typecheck

  managed-gateway-tests:
    name: Managed gateway regressions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify proof commit and feature parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          test "$(git diff --name-only "$FRESHELL_PROOF_FEATURE_COMMIT" HEAD)" = '.github/workflows/rust-tests.yml'
          printf 'Proof commit: %s\nFeature commit: %s\n' "$GITHUB_SHA" "$FRESHELL_PROOF_FEATURE_COMMIT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Answer attempts retain distinct correlated failures
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p freshell-server --features managed-runtime-v1 --bin freshell-server hosted_answer_attempts_broadcast_distinct_correlated_failures -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/answer-attempts.log"
          grep -Eq '^running [1-9][0-9]* tests?$' "$RUNNER_TEMP/answer-attempts.log"
      - name: Attach replays source-fenced answer attempts and receipts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p freshell-server --features managed-runtime-v1 --bin freshell-server hosted_attach_replays_source_fenced_answer_starts_and_delayed_receipts -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/answer-attach.log"
          grep -Eq '^running [1-9][0-9]* tests?$' "$RUNNER_TEMP/answer-attach.log"
      - name: Restarted poller marks replayed answer attempts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p freshell-server --features managed-runtime-v1 --bin freshell-server restarted_gateway_poller_marks_its_initial_answer_starts_as_replay -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/poller-replay.log"
          grep -Eq '^running [1-9][0-9]* tests?$' "$RUNNER_TEMP/poller-replay.log"
      - name: Control failures preserve correlation and uncertainty
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p freshell-server --features managed-runtime-v1 --bin freshell-server hosted_non_send_failures_keep_operation_correlation_and_uncertain_outcomes -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/control-failures.log"
          grep -Eq '^running [1-9][0-9]* tests?$' "$RUNNER_TEMP/control-failures.log"
      - name: Elicitation preserves typed content and opaque IDs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p freshell-server --features managed-runtime-v1 --bin freshell-server task5_hosted_elicitation_reuses_resolve_with_tagged_typed_content_and_opaque_ids -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/elicitation.log"
          grep -Eq '^running [1-9][0-9]* tests?$' "$RUNNER_TEMP/elicitation.log"
