name: Claude cold hold red proof

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRESHELL_PROOF_FEATURE_COMMIT: 4aeb5c5e017351b675dba368eb960f2ae01f3bf5

jobs:
  simulator-hold:
    name: Cold hold behavior against unchanged simulator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify proof source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FRESHELL_PROOF_FEATURE_COMMIT"
          printf '%s\n' '.github/workflows/rust-tests.yml' 'crates/freshell-ws/tests/freshagent_claude_kill_interrupt.rs' 'test/integration/providers/claude-cli-sim.test.ts' > "$RUNNER_TEMP/expected"
          git diff --name-only "$FRESHELL_PROOF_FEATURE_COMMIT" HEAD > "$RUNNER_TEMP/actual"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run behavior test in disposable runtime sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/claude-hold-red"
          scripts/sandbox-test.sh --runtime-suite 'pnpm run test:vitest run test/integration/providers/claude-cli-sim.test.ts --config config/vitest/vitest.config.ts -t "holds a cold command until Stop when explicitly requested"' 2>&1 | tee "$RUNNER_TEMP/claude-hold-red/output.log"
      - name: Retain complete output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-hold-red
          path: ${{ runner.temp }}/claude-hold-red/
          if-no-files-found: warn
          retention-days: 7
