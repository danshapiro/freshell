name: Typecheck Client

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: typecheck-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run client typecheck
        run: npm run typecheck:client

      # Keep the default Vitest lane nonempty while its config excludes tests
      # that own Rust/artifact setup. Those prerequisites belong to their
      # dedicated jobs rather than this fast client check.
      - name: Run default Vitest lane
        run: npm run test:vitest -- run --config config/vitest/vitest.config.ts
