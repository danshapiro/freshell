name: Rust Clippy

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-clippy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pinned toolchain (NOT @stable): keeps green-local <=> green-CI deterministic.
      # Current stable (1.97.x) already adds default-warn lints this branch was not
      # validated against. Bump this pin deliberately: update the version, re-run the
      # gate locally on that toolchain, fix new lints in the same PR.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # freshell-tauri (Tauri v2 / WRY) needs GTK+WebKit system libs to compile
      # on ubuntu-latest; installing them keeps the gate truly --workspace.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev pkg-config build-essential

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --all-targets does not imply --all-features: the real-transport
      # backends are default-off and would otherwise go unlinted.
      - name: cargo clippy (feature-gated backends)
        run: |
          cargo clippy -p freshell-codex --features real-transport --all-targets -- -D warnings
          cargo clippy -p freshell-opencode --features real-transport --all-targets -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4

      # Same pinned toolchain as the clippy job (NOT @stable).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # freshell-tauri needs GTK+WebKit system libs to compile (same set as clippy job).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev pkg-config build-essential

      # freshell-freshagent and freshell-ws tests spawn MCP servers that resolve tsx from node_modules.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Build the server binary explicitly so the Tauri smoke can never soft-skip.
      - name: Build Rust server for Tauri smoke
        run: cargo build -p freshell-server --locked

      # --locked for reproducibility parity with port-contract.yml.
      # FRESHELL_SERVER_BIN ensures the Tauri smoke finds the binary via env var.
      - name: Rust workspace tests
        env:
          FRESHELL_SERVER_BIN: ${{ github.workspace }}/target/debug/freshell-server
        run: cargo test --workspace --locked

      # Dedicated Tauri smoke with --nocapture so the CI log visibly shows
      # "using server binary:" (confirming the test exercised the real binary,
      # not soft-skipped). The grep enforces non-vacuity: if the binary is ever
      # missing, the smoke soft-skips and the grep fails, turning CI red.
      - name: Tauri app-bound server spawn smoke
        env:
          FRESHELL_SERVER_BIN: ${{ github.workspace }}/target/debug/freshell-server
        shell: bash
        run: |
          set -o pipefail
          cargo test -p freshell-tauri --locked --test server_spawn_smoke app_bound_spawn_health_reap_end_to_end -- --exact --nocapture 2>&1 | tee /tmp/smoke.log
          grep -q 'using server binary:' /tmp/smoke.log
