packages:
  - crates/freshell-claude-sidecar
  - packages/freshell-mcp-runtime
nodeLinker: isolated
injectWorkspacePackages: true
enablePrePostScripts: true
resolvePeersFromWorkspaceRoot: false
packageManagerStrictVersion: true
managePackageManagerVersions: false
overrides:
  fast-uri: 3.1.7
  hono: 4.13.7
  qs: 6.16.0
  "tsx>esbuild": 0.28.2
allowBuilds:
  electron: true
  esbuild: true
  # fsevents (darwin-only, optional) is deliberately NOT allow-listed: its
  # install script stays blocked with a warning, and macOS Electron builds
  # pass without it (PR #820 CI: macos-latest and macos-15-intel green).
  # If a macOS issue ever traces to the missing native binding, allow it
  # here as a deliberate decision.
