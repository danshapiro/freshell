# Controller-service topology only. Dynamic session-host containers are NOT
# Compose services and are never targets of `compose down`; the supervisor
# creates/stops them from durable registry receipts.
name: freshell-managed-runtime
services:
  supervisor:
    image: ${FRESHELL_SUPERVISOR_IMAGE:?set a pinned supervisor image}
    restart: unless-stopped
    # FRESHELL_SUPERVISOR_IMAGE is a deployment-provided pin — this repo
    # builds only the workload image (docker/runtime/Dockerfile), so the
    # supervisor image is a contract, not a build product. Required contract:
    # no supervisor ENTRYPOINT (or one that execs its args verbatim) and the
    # freshell-supervisor binary on the image PATH. The args below carry the
    # documented launch's flag set
    # (installers/systemd/freshell-supervisor.service) over compose topology
    # paths: registry on the named volume, control socket/secret inside the
    # control-dir bind (the web service expects those exact paths), the
    # daemon-host docker socket, the shared runtime root at itself, and the
    # pinned workload image from managed-runtime.env. A contract violation
    # is a restart loop whose tell is in `docker compose logs supervisor`:
    # a binary missing from PATH reports "executable file not found"; an
    # ENTRYPOINT of the supervisor itself consumes command[0] as a stray
    # argument and the CLI exits with its usage line (a supervisor.fatal
    # event) instead of serving.
    command:
      - freshell-supervisor
      - serve
      - --registry-root
      - /var/lib/freshell-supervisor
      - --control-socket
      - /run/freshell-supervisor/supervisor.sock
      - --control-secret-file
      - /run/freshell-supervisor/secret
      - --docker-socket
      - /var/run/docker.sock
      - --runtime-root
      - ${FRESHELL_RUNTIME_ROOT:?set shared runtime root}
      - --host-binary
      - ${FRESHELL_SESSION_HOST_BINARY:?set the daemon-host session-host binary}
      - --image-ref
      - ${FRESHELL_RUNTIME_IMAGE:?set the pinned workload image}
      - --test-run-id
      - managed-runtime
      - --operator-home
      - ${FRESHELL_OPERATOR_HOME:?set the operator home}
    volumes:
      - supervisor-registry:/var/lib/freshell-supervisor
      - ${FRESHELL_RUNTIME_CONTROL_DIR:?set runtime control dir}:/run/freshell-supervisor
      # Docker resolves dynamic host binds on the daemon host, so the
      # supervisor must see incarnation and per-soul actor paths unchanged.
      - ${FRESHELL_RUNTIME_ROOT:?set shared runtime root}:${FRESHELL_RUNTIME_ROOT:?set shared runtime root}:rw
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # Operator home, read-only at its canonical host path: souls bind it so
      # in-home config `{file:}` references resolve. The same canonical path on
      # both sides (the daemon resolves the source on the daemon host) and in
      # --operator-home above, whose st_uid appears as container 0 under the
      # rootless mapping — matching the root supervisor's euid and passing the
      # owner guard. Prepare the home with scripts/prepare-operator-home.sh.
      - ${FRESHELL_OPERATOR_HOME:?set the operator home}:${FRESHELL_OPERATOR_HOME:?set the operator home}:ro
      # Optional real-Claude bootstrap. Same canonical host path on both
      # controller services; unset falls back to a harmless non-credential
      # device/path pair and is never forwarded to a workload.
      - ${FRESHELL_MANAGED_CLAUDE_CREDENTIAL_FILE:-/dev/null}:${FRESHELL_MANAGED_CLAUDE_CREDENTIAL_FILE:-/run/freshell-no-claude-credential}:ro
  web:
    image: ${FRESHELL_WEB_IMAGE:?set a pinned web image}
    restart: unless-stopped
    environment:
      FRESHELL_MANAGED_RUNTIME_V1: "1"
      FRESHELL_RUNTIME_CONTROL_SOCKET: /run/freshell-supervisor/supervisor.sock
      FRESHELL_RUNTIME_CONTROL_SECRET_FILE: /run/freshell-supervisor/secret
      FRESHELL_MANAGED_CLAUDE_CREDENTIAL_FILE: ${FRESHELL_MANAGED_CLAUDE_CREDENTIAL_FILE:-}
    volumes:
      - ${FRESHELL_RUNTIME_CONTROL_DIR:?set runtime control dir}:/run/freshell-supervisor:ro
      - ${FRESHELL_MANAGED_CLAUDE_CREDENTIAL_FILE:-/dev/null}:${FRESHELL_MANAGED_CLAUDE_CREDENTIAL_FILE:-/run/freshell-no-claude-credential}:ro

volumes:
  supervisor-registry: {}
