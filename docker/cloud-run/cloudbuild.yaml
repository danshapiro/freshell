# Submitted by scripts/lib/cloud-image.sh (scripts/vitest-cloud.sh and
# scripts/e2e-cloud.sh) with the build-context snapshot as its source.
# Substitutions:
#   _IMAGE                  image ref to publish (<repo>:<tag>)
#   _CACHE_IMAGE            BuildKit registry cache ref
#   _FRESHELL_BUILD_COMMIT  full commit sha stamped into the artifacts
# The last step records the pushed image digest as build step output, so the
# runner pins its Cloud Run job to exactly the image this build produced.
steps:
  # Create a buildx builder that supports registry cache export.
  # The default docker driver does not support --cache-to type=registry.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker buildx create --use --name cloud-builder --driver docker-container || docker buildx use cloud-builder']
  # Pull existing cache image for layer caching (exit 0 if not found yet).
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull ${_CACHE_IMAGE} || exit 0']
    env:
      - 'DOCKER_BUILDKIT=1'
  # Build with BuildKit + mode=max registry cache to preserve intermediate
  # stage layers (rust-builder, node-builder), not just the final image.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'buildx'
      - 'build'
      - '-f'
      - 'docker/cloud-run/Dockerfile'
      - '-t'
      - '${_IMAGE}'
      - '--build-arg'
      - 'FRESHELL_BUILD_COMMIT=${_FRESHELL_BUILD_COMMIT}'
      - '--cache-from'
      - 'type=registry,ref=${_CACHE_IMAGE}'
      - '--cache-to'
      - 'type=registry,ref=${_CACHE_IMAGE},mode=max'
      - '--metadata-file'
      - '/workspace/image-metadata.json'
      - '--push'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'
  # Publish the digest buildx pushed (never re-resolved from the mutable tag).
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        digest="$$(grep -o '"containerimage.digest": *"sha256:[0-9a-f]\{64\}"' /workspace/image-metadata.json | grep -o 'sha256:[0-9a-f]\{64\}')"
        test -n "$$digest"
        echo "Pushed ${_IMAGE} as $$digest"
        printf '%s' "$$digest" > "$$BUILDER_OUTPUT/output"
options:
  machineType: 'E2_HIGHCPU_32'
  diskSizeGb: 200
  # Build logs land in Cloud Logging, readable with roles/logging.viewer —
  # the legacy default GCS log bucket would need project-wide roles/viewer
  # for the submitting identity (gcloud-robot conversion). Note: this mode
  # does not stream logs during submit; read after with `gcloud builds log`.
  logging: 'CLOUD_LOGGING_ONLY'
timeout: '3600s'
